<title>Probe Calibration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: three neuron columns (small multiples) above one comparison table; same tokens as the dossiers */
:root {
  --bg: #f6f7f5; --surface: #ffffff; --ink: #14191a; --ink-2: #4a5351; --ink-3: #788280;
  --rule: #dde2df; --grid: #e8ebe9; --accent: #1f6b5c; --accent-soft: #e2eeea;
  --good: #1f7a3a; --good-bg: #e4f2e8; --bad: #b3261e; --bad-bg: #f8e5e3; --warn: #8a5a00; --warn-bg: #f7eed8;
  --div-pos: #2a78d6; --div-neg: #e34948; --div-mid: #d9d7d1;
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111514; --surface: #191e1d; --ink: #eef1ef; --ink-2: #b8c0bd; --ink-3: #89938f;
    --rule: #2b3230; --grid: #232927; --accent: #5fc2a8; --accent-soft: #1c2e29;
    --good: #6fcf8a; --good-bg: #1c2e22; --bad: #f08a80; --bad-bg: #351f1d; --warn: #e5b45a; --warn-bg: #33291a;
    --div-pos: #3987e5; --div-neg: #e66767; --div-mid: #4a4a46; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111514; --surface: #191e1d; --ink: #eef1ef; --ink-2: #b8c0bd; --ink-3: #89938f;
  --rule: #2b3230; --grid: #232927; --accent: #5fc2a8; --accent-soft: #1c2e29;
  --good: #6fcf8a; --good-bg: #1c2e22; --bad: #f08a80; --bad-bg: #351f1d; --warn: #e5b45a; --warn-bg: #33291a;
  --div-pos: #3987e5; --div-neg: #e66767; --div-mid: #4a4a46; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.6 var(--font-body); }
.page { max-width: 1080px; margin: 0 auto; padding-inline: 20px; padding-block: 48px 96px; display: flex; flex-direction: column; gap: 44px; }
.prose { max-width: 70ch; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 650; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(2rem, 5vw, 3rem); line-height: 1.06; }
h2 { font-size: 1.55rem; line-height: 1.2; }
h3 { font-size: 1.15rem; }
p { margin: 0; }
section { display: flex; flex-direction: column; gap: 14px; }
.eyebrow { font: 500 0.74rem/1.2 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.deck { font-size: 1.12rem; color: var(--ink-2); max-width: 68ch; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.col { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.col .id { font: 500 0.8rem/1 var(--font-mono); color: var(--ink-3); }
.col .label { font-size: 0.88rem; color: var(--ink-2); }
.chip { display: inline-flex; width: fit-content; font: 500 0.72rem/1 var(--font-mono); letter-spacing: 0.04em; text-transform: uppercase; padding: 5px 9px; border-radius: 999px; }
.chip.good { color: var(--good); background: var(--good-bg); } .chip.warn { color: var(--warn); background: var(--warn-bg); } .chip.bad { color: var(--bad); background: var(--bad-bg); }
.chart-wrap { position: relative; width: 100%; }
.chart-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font: 0.76rem/1.45 var(--font-mono); padding: 8px 10px; border-radius: 6px; max-width: 300px; transform: translate(-50%, calc(-100% - 12px)); z-index: 2; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.84rem; color: var(--ink-2); justify-content: center; }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
.tbl { overflow-x: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font: 500 0.7rem/1.3 var(--font-mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-3); }
td.num { font-family: var(--font-mono); white-space: nowrap; }
th:first-child, td:first-child { min-width: 220px; width: 28%; }
td.wrap { white-space: normal; font-size: 0.8rem; }
td .why { display: block; font-size: 0.78rem; color: var(--ink-3); }
code { font-family: var(--font-mono); font-size: 0.86em; }
.callout { background: var(--accent-soft); border-radius: 8px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; max-width: 76ch; }
@media (max-width: 560px) { .page { padding-block: 28px 64px; } }
</style>

<div class="page" id="app"></div>
<script id="cal-data" type="application/json">__CAL_DATA__</script>
<script>
(function () {
  const N = JSON.parse(document.getElementById("cal-data").textContent);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const f2 = v => (v == null ? "–" : Number(v).toFixed(2));
  const pct = v => (v == null ? "–" : Math.round(100 * v) + "%");
  const ns = "http://www.w3.org/2000/svg";
  const mk = (tag, a, p) => { const e = document.createElementNS(ns, tag); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
  const txt = (p, x, y, s, ex = {}) => { const t = mk("text", Object.assign({ x, y, fill: "var(--ink-3)", "font-size": 11, "font-family": "IBM Plex Sans, sans-serif" }, ex), p); t.textContent = s; return t; };
  const app = document.getElementById("app");
  const add = html => { const d = document.createElement("section"); d.innerHTML = html; app.appendChild(d); return d; };
  const chipClass = v => /unrelated|clean|one main/i.test(v) ? "good" : /no single/i.test(v) ? "bad" : "warn";

  const hdr = document.createElement("header");
  hdr.style.cssText = "display:flex;flex-direction:column;gap:14px";
  hdr.innerHTML = `<div class="eyebrow">Neuron probe · calibration · Bonsai-8B (1-bit)</div><h1>Does the probe tell neurons apart?</h1>
    <p class="deck">A tool that calls every neuron monosemantic is useless. Three neurons ran through the same protocol: blind sentence banks, pre-registered held-out tests, text-level inverse with SciPy and globalMOO, and induction. One looked clean in an earlier screen, one looked clean with unrelated poles, and one I could not label. The probe's verdicts differ as they should, but no single number does it on its own.</p>`;
  app.appendChild(hdr);

  // small-multiple irises
  const s1 = add(`<div class="eyebrow">The three neurons</div><div class="cols">${N.map((n, i) => `<div class="col">
      <span class="id">${esc(n.id)}</span><h3>${esc(n.title)}</h3><span class="chip ${chipClass(n.verdict)}">${esc(n.verdict)}</span>
      <div class="label">${esc(n.label)}</div><div class="chart-wrap" id="iris${i}"></div></div>`).join("")}</div>
    <div class="legend"><span><i style="background:var(--div-pos)"></i>drives the probed pole</span><span><i style="background:var(--div-mid)"></i>neither</span><span><i style="background:var(--div-neg)"></i>drives the opposite pole</span><span>centre = on the label · rim = unrelated</span></div>`);
  N.forEach((n, i) => iris(document.getElementById("iris" + i), n));

  // scorecard
  const M = N.map(n => n.metrics);
  const row = (name, why, cells, wrap) => `<tr><td>${esc(name)}<span class="why">${esc(why)}</span></td>${cells.map(c => `<td class="num${wrap ? " wrap" : ""}">${c}</td>`).join("")}</tr>`;
  add(`<div class="eyebrow">Scorecard</div><h2>What separates them, and what does not</h2>
    <div class="tbl"><table><thead><tr><th>Measure</th>${N.map(n => `<th>${esc(n.title)}</th>`).join("")}</tr></thead><tbody>
    ${row("Held-out fire rate", "new sentences written from the label alone that fired the pole (≥ 0.3)", M.map(m => pct(m.holdout_fire)))}
    ${row("Held-out false positives", "near misses that fired", M.map(m => pct(m.holdout_fp)))}
    ${row("Held-out AUROC", "ranking of predicted-fire above predicted-quiet", M.map(m => f2(m.holdout_auroc)))}
    ${row("Bank AUROC", "label relevance vs activation on the bank", M.map(m => f2(m.bank_auroc)))}
    ${row("Opposite pole: on-label fire rate", "sentences written for the opposite pole's label that fired it", M.map(m => pct(m.opp_strong_on)))}
    ${row("Cross-talk", "opposite pole's mean activation on the probed pole's concept (are the poles related?)", M.map(m => f2(m.cross)))}
    ${row("Leak found by the inverse", "strongest activation with nothing related present (≥ 0.3 = a leak)", M.map(m => f2(m.leak)))}
    ${row("Induction strength", "KL from the unsteered model at ±20× corpus max", M.map(m => `${f2(m.kl_neg20)} / ${f2(m.kl_pos20)}`))}
    ${row("Induction, pushed negative", "tokens gaining the most probability at −10×", M.map(m => esc(m.gains_neg.join(" "))), true)}
    ${row("Induction, pushed positive", "tokens gaining the most probability at +10×", M.map(m => esc(m.gains_pos.join(" "))), true)}
    ${row("globalMOO graded targets 25/50/75%", "met? (evaluations after the shared design)", M.map(m => m.gmoo_levels.map((ok, j) => `${ok ? "✓" : "✗"}${m.gmoo_level_evals[j] ?? ""}`).join(" ")))}
    </tbody></table></div>
    <div class="callout"><h3>Reading the scorecard</h3>
      <p><b>Held-out fire rate is the most discriminating single number</b> (genre 75%, nerve 58%, unclear 33%). It is the essay's own test: does text written from the label make the neuron fire?</p>
      <p><b>AUROC alone is too lenient.</b> After one refinement, the unclear neuron's label ranks new sentences as well as the nerve label does (0.92). It just rarely makes the neuron fire.</p>
      <p><b>Low leakage alone does not mean clean.</b> The unclear neuron leaks least, because it barely fires on anything. The opposite pole and induction separate it: its opposite pole never fires on its label, and pushing it changes the model weakly and without a theme.</p>
      <p><b>Cross-talk tells related poles from unrelated ones.</b> Nerve's opposite pole fires on nerve text (0.21): one axis. Genre's ignores genre text (0.005): two unrelated jobs.</p></div>`);
  add(`<div class="eyebrow">Caveats</div><ul class="prose" style="margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px">
    <li>Three neurons. The calibration neurons were chosen because an earlier screen called them clean-with-unrelated-poles and unclear, so this checks the probe's verdicts against that screen, not against ground truth.</li>
    <li>Banks for the two calibration neurons were written by separate agents that saw only corpus examples. The nerve bank and its held-out set were written in-session. One held-out agent saw bank ratings (not activations) while extracting the label.</li>
    <li>Each neuron had at most one label refinement before its held-out test, and every held-out set was committed to git before it was run.</li>
  </ul>`);

  function iris(wrap, n) {
    const pts = [];
    const sectorOf = r => r.kind === "top" ? (r.rel >= 0.5 ? "on" : r.rel_neg >= 0.8 ? "opposite" : "unrelated") : r.kind === "corpus" ? "unrelated" : r.kind;
    n.bank.forEach(r => pts.push({ sector: sectorOf(r), rel: r.rel, act: r.act, opp: r.opp, text: r.text, sub: r.branch }));
    n.holdout.forEach(r => pts.push({ sector: "held-out", rel: r.predict === "fire" ? 0.95 : 0.15, act: r.act, opp: r.opp, text: r.text, sub: "predicted " + r.predict, ho: true }));
    const order = ["on", "held-out", "near", "spelling", "opposite", "unrelated"];
    const names = { on: "on-concept", "held-out": "held-out", near: "related", spelling: "look-alikes", opposite: "opposite", unrelated: "unrelated" };
    const sectors = order.filter(o => pts.some(p => p.sector === o));
    const W = 360, C = W / 2, R1 = 46, R = 150, R0 = 24;
    const radius = rel => R1 + (1 - Math.max(0, Math.min(1, rel))) * (R - R1);
    const svg = mk("svg", { viewBox: `-30 -10 ${W + 60} ${W + 20}`, role: "img", "aria-label": `Iris of ${n.title}: probe sentences around the neuron, coloured by which pole they drive` });
    [1, 0.5, 0].forEach(rel => mk("circle", { cx: C, cy: C, r: radius(rel), fill: "none", stroke: "var(--grid)", "stroke-dasharray": rel === 0.5 ? "3 4" : "" }, svg));
    const span = 2 * Math.PI / sectors.length;
    sectors.forEach((sn, si) => {
      const a0 = -Math.PI / 2 + si * span, am = a0 + span / 2;
      mk("line", { x1: C + R0 * Math.cos(a0), y1: C + R0 * Math.sin(a0), x2: C + (R + 8) * Math.cos(a0), y2: C + (R + 8) * Math.sin(a0), stroke: "var(--grid)" }, svg);
      txt(svg, C + (R + 18) * Math.cos(am), C + (R + 18) * Math.sin(am) + 4, names[sn], { "text-anchor": Math.abs(Math.cos(am)) < 0.3 ? "middle" : Math.cos(am) > 0 ? "start" : "end", "font-size": 11 });
      const mine = pts.filter(p => p.sector === sn).sort((a, b) => b.rel - a.rel);
      mine.forEach((p, i) => {
        const a = a0 + span * (0.08 + 0.84 * (mine.length > 1 ? i / (mine.length - 1) : 0.5));
        const rr = radius(p.rel) + ((i % 5) - 2) * 5;
        p.x = C + rr * Math.cos(a); p.y = C + rr * Math.sin(a);
      });
    });
    wrap.appendChild(svg);
    const tip = document.createElement("div"); tip.className = "tip"; tip.hidden = true; wrap.appendChild(tip);
    pts.sort((a, b) => Math.abs(a.act - a.opp) - Math.abs(b.act - b.opp)).forEach(p => {
      const v = Math.max(-1, Math.min(1, (p.act || 0) - (p.opp || 0)));
      const col = v >= 0 ? `color-mix(in oklab, var(--div-pos) ${Math.round(100 * Math.sqrt(v))}%, var(--div-mid))` : `color-mix(in oklab, var(--div-neg) ${Math.round(100 * Math.sqrt(-v))}%, var(--div-mid))`;
      const c = mk("circle", { cx: p.x, cy: p.y, r: 2.5 + 3.5 * Math.min(1, Math.max(p.act || 0, p.opp || 0)), fill: col, stroke: p.ho ? "var(--ink-2)" : "var(--surface)", "stroke-width": 0.8 }, svg);
      c.addEventListener("pointerenter", () => { const b = svg.getBoundingClientRect(); tip.innerHTML = `<b>${esc(p.text)}</b><br>pole ${f2(p.act)} · opposite ${f2(p.opp)}`; tip.style.left = ((p.x + 30) / (W + 60) * b.width) + "px"; tip.style.top = ((p.y + 10) / (W + 20) * b.height) + "px"; tip.hidden = false; });
      c.addEventListener("pointerleave", () => tip.hidden = true);
    });
    mk("circle", { cx: C, cy: C, r: R0 - 4, fill: "var(--accent-soft)", stroke: "var(--accent)", "stroke-width": 1.5 }, svg);
  }
})();
</script>
