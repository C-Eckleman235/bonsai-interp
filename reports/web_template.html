<title>The Nerve Neighbourhood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: wide graph band (layers left→right) with a node inspector beside it; analysis sections below in a reading column */
:root {
  --bg: #f6f7f5; --surface: #ffffff; --ink: #14191a; --ink-2: #4a5351; --ink-3: #788280;
  --rule: #dde2df; --grid: #e8ebe9; --accent: #1f6b5c; --accent-soft: #e2eeea;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --good: #1f7a3a; --good-bg: #e4f2e8; --bad: #b3261e; --bad-bg: #f8e5e3; --na: #b7bdba;
  --div-pos: #2a78d6; --div-neg: #e34948; --div-mid: #d9d7d1;
  --font-display: "Fraunces", Georgia, serif; --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111514; --surface: #191e1d; --ink: #eef1ef; --ink-2: #b8c0bd; --ink-3: #89938f; --rule: #2b3230; --grid: #232927;
    --accent: #5fc2a8; --accent-soft: #1c2e29; --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --good: #6fcf8a; --good-bg: #1c2e22; --bad: #f08a80; --bad-bg: #351f1d; --na: #5b6461;
    --div-pos: #3987e5; --div-neg: #e66767; --div-mid: #4a4a46; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111514; --surface: #191e1d; --ink: #eef1ef; --ink-2: #b8c0bd; --ink-3: #89938f; --rule: #2b3230; --grid: #232927;
  --accent: #5fc2a8; --accent-soft: #1c2e29; --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --good: #6fcf8a; --good-bg: #1c2e22; --bad: #f08a80; --bad-bg: #351f1d; --na: #5b6461;
  --div-pos: #3987e5; --div-neg: #e66767; --div-mid: #4a4a46; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font-body); }
.page { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 40px 90px; display: flex; flex-direction: column; gap: 40px; }
.prose { max-width: 72ch; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 650; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(2rem, 5vw, 3rem); line-height: 1.05; }
h2 { font-size: 1.5rem; } h3 { font-size: 1.08rem; }
p { margin: 0; }
section { display: flex; flex-direction: column; gap: 14px; }
.eyebrow { font: 500 0.74rem/1.2 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.deck { font-size: 1.1rem; color: var(--ink-2); max-width: 70ch; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.tile .v { font: 500 1.5rem/1.15 var(--font-mono); font-variant-numeric: tabular-nums; }
.tile .l { font-size: 0.82rem; color: var(--ink-2); }
.graph-band { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; align-items: start; }
@media (max-width: 900px) { .graph-band { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 14px; min-width: 0; }
.graph-wrap { overflow-x: auto; }
.graph-wrap svg { display: block; min-width: 980px; width: 100%; height: auto; }
.node { cursor: pointer; }
.node:focus-visible circle { stroke: var(--accent); stroke-width: 3; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.8rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; }
.legend i.ln { width: 20px; height: 3px; border-radius: 2px; }
.insp { display: flex; flex-direction: column; gap: 10px; position: sticky; top: 12px; }
.insp .unit { font: 500 0.95rem/1.2 var(--font-mono); }
.insp .lab { font-weight: 500; }
.chip { display: inline-flex; width: fit-content; font: 500 0.7rem/1 var(--font-mono); letter-spacing: 0.04em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px; }
.chip.good { color: var(--good); background: var(--good-bg); } .chip.bad { color: var(--bad); background: var(--bad-bg); } .chip.na { color: var(--ink-2); background: var(--grid); }
.ex { font: 0.74rem/1.45 var(--font-mono); color: var(--ink-2); background: var(--bg); border-radius: 4px; padding: 5px 7px; overflow-wrap: anywhere; }
.ex mark { background: #fff1c7; color: #4a3500; border-radius: 2px; padding: 0 1px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 0.82rem; }
.kv dt { color: var(--ink-3); } .kv dd { margin: 0; font-family: var(--font-mono); }
.tbl { overflow-x: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 0.84rem; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font: 500 0.68rem/1.3 var(--font-mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-3); }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--accent-soft); }
td.num { font-family: var(--font-mono); white-space: nowrap; }
.chart-wrap { position: relative; } .chart-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font: 0.75rem/1.4 var(--font-mono); padding: 7px 9px; border-radius: 6px; max-width: 300px; transform: translate(-50%, calc(-100% - 10px)); z-index: 3; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
.callout { background: var(--accent-soft); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; max-width: 80ch; }
code { font-family: var(--font-mono); font-size: 0.86em; }
</style>

<div class="page" id="app"></div>
<script id="web-data" type="application/json">__WEB_DATA__</script>
<script>
(function () {
  const D = JSON.parse(document.getElementById("web-data").textContent);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const f2 = v => (v == null ? "–" : Number(v).toFixed(2));
  const pct = v => (v == null ? "–" : Math.round(100 * v) + "%");
  const ns = "http://www.w3.org/2000/svg";
  const mk = (t, a, p) => { const e = document.createElementNS(ns, t); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
  const txt = (p, x, y, s, ex = {}) => { const t = mk("text", Object.assign({ x, y, fill: "var(--ink-3)", "font-size": 11, "font-family": "IBM Plex Sans, sans-serif" }, ex), p); t.textContent = s; return t; };
  const app = document.getElementById("app");
  const add = html => { const s = document.createElement("section"); s.innerHTML = html; app.appendChild(s); return s; };
  const N = D.nodes, byU = Object.fromEntries(N.map(n => [n.unit, n]));
  const verdict = n => n.claude == null ? "na" : n.claude.survives ? "good" : "bad";

  // header
  const h = document.createElement("header"); h.style.cssText = "display:flex;flex-direction:column;gap:12px";
  const nHeld = N.filter(n => n.claude && n.claude.survives).length, nTested = N.filter(n => n.claude).length;
  h.innerHTML = `<div class="eyebrow">Neighbourhood web · L9/N3688 · Bonsai-8B (1-bit)</div><h1>The Nerve Neighbourhood</h1>
    <p class="deck">${esc(D.claim)}</p>`;
  app.appendChild(h);
  add(`<div class="tiles">
    <div class="tile"><span class="v">${N.length}</span><span class="l">neurons reached from "nerve" (readers, their other inputs, co-firing, second-hop feeders)</span></div>
    <div class="tile"><span class="v">${nHeld} / ${nTested}</span><span class="l">labels that held a pre-registered 8 + 8 sentence test (Claude-written)</span></div>
    <div class="tile"><span class="v">${D.lateral.length}</span><span class="l">lateral relatives of psychological "nerve" found (tension, suspense, anticipation…)</span></div>
    <div class="tile"><span class="v">${pct(D.sources.summary.fire_rate.bonsai)} vs ${pct(D.sources.summary.fire_rate.claude)}</span><span class="l">fire rate of Bonsai-written vs Claude-written test sentences, same labels</span></div></div>`);

  // ---------------- graph
  const g = add(`<div class="eyebrow">Web</div><h2>Who feeds it, who reads it, who sits beside it</h2>
    <div class="legend"><span><i style="background:var(--good)"></i>label held its test</span><span><i style="background:var(--bad)"></i>label failed</span><span><i style="background:var(--na)"></i>not tested</span>
    <span><i class="ln" style="background:var(--ink)"></i>feeds</span><span><i class="ln" style="background:var(--s1)"></i>reads "nerve"</span><span><i class="ln" style="background:var(--s3)"></i>feeds a reader (lateral)</span>
    <span><i class="ln" style="background:var(--s2)"></i>gate</span><span><i class="ln" style="background:var(--ink-3)"></i>co-fires (dashed)</span><span><i style="background:none;border:2px solid var(--accent)"></i>lateral cluster</span></div>
    <div class="graph-band"><div class="panel graph-wrap" id="graph"></div><div class="panel insp" id="insp"><p style="color:var(--ink-3);font-size:.9rem">Select a neuron in the web or the table to inspect it.</p></div></div>`);
  {
    const W = 1180, H = 860, mL = 30, mR = 150, mT = 30, mB = 40, Lmax = 20;
    const x = L => mL + L / Lmax * (W - mL - mR);
    const svg = mk("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Layered graph of neurons around L9/N3688" });
    for (let L = 0; L <= Lmax; L++) { mk("line", { x1: x(L), x2: x(L), y1: mT - 10, y2: H - mB + 6, stroke: "var(--grid)" }, svg); txt(svg, x(L), H - 14, "L" + L, { "text-anchor": "middle", "font-family": "IBM Plex Mono, monospace", "font-size": 12, fill: L === 9 ? "var(--accent)" : "var(--ink-3)" }); }
    const all = [{ unit: D.center, L: 9, center: true }, ...N];
    const cols = {};
    all.forEach(n => (cols[n.L] = cols[n.L] || []).push(n));
    const order = r => (r.center ? 5 : r.roles.includes("input") || r.roles.includes("gate") ? 1 : r.roles.includes("hop-2 upstream") ? 0 : r.roles.includes("reader") ? 3 : r.roles.includes("co-fires") ? 6 : 8);
    Object.values(cols).forEach(c => { c.sort((a, b) => order(a) - order(b) || a.n - b.n); c.forEach((n, i) => { n.y = mT + 20 + (i + 0.5) * ((H - mT - mB - 30) / c.length); n.x = x(n.L) + (c.length > 5 ? ((i % 2) * 2 - 1) * 12 : 0); }); });
    const pos = Object.fromEntries(all.map(n => [n.unit, n]));
    const col = { feeds: "var(--ink)", reads: "var(--s1)", "feeds reader": "var(--s3)", gates: "var(--s2)", "co-fires": "var(--ink-3)" };
    D.edges.forEach(e => {
      const a = pos[e.from], b = pos[e.to]; if (!a || !b) return;
      const w = Math.min(4, 0.8 + 18 * Math.abs(e.w) * (e.kind === "co-fires" ? 0.15 : 1));
      const mx = (a.x + b.x) / 2;
      mk("path", { d: `M${a.x},${a.y} C${mx},${a.y} ${mx},${b.y} ${b.x},${b.y}`, fill: "none", stroke: col[e.kind] || "var(--ink-3)", "stroke-width": w,
        "stroke-opacity": e.kind === "co-fires" ? 0.5 : 0.75, "stroke-dasharray": e.kind === "co-fires" ? "4 4" : "" }, svg);
    });
    const tipWrap = document.getElementById("graph"); tipWrap.style.position = "relative";
    all.forEach(n => {
      const gN = mk("g", { class: "node", tabindex: 0, role: "button", "aria-label": n.unit }, svg);
      const fill = n.center ? "var(--accent)" : `var(--${verdict(n) === "good" ? "good" : verdict(n) === "bad" ? "bad" : "na"})`;
      mk("circle", { cx: n.x, cy: n.y, r: n.center ? 15 : 9, fill, stroke: n.lateral ? "var(--accent)" : "var(--surface)", "stroke-width": n.lateral ? 3 : 1.5 }, gN);
      const short = n.center ? "nerve" : (n.short || "");
      txt(gN, n.x + (n.center ? 19 : 13), n.y + 4.5, short, { "font-size": n.center ? 15 : 12.5, fill: n.center ? "var(--ink)" : "var(--ink-2)", "font-weight": n.center || n.lateral ? 600 : 400 });
      if (!n.center) { gN.addEventListener("click", () => inspect(n.unit)); gN.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); inspect(n.unit); } }); }
    });
    document.getElementById("graph").appendChild(svg);
  }

  function inspect(u) {
    const n = byU[u], c = n.claude, b = n.bonsai;
    const res = (r, who) => !r ? `<dt>${who}</dt><dd>–</dd>` : `<dt>${who}</dt><dd><span class="chip ${r.survives ? "good" : "bad"}">${r.survives ? "held" : "failed"}</span> fire ${r.n_fire}/${r.n_written[0]} · FP ${r.n_false_pos}/${r.n_written[1]}</dd>`;
    const hl = t => esc(t).replace("⟦", "<mark>").replace("⟧", "</mark>").replace(/⏎/g, "↵ ");
    document.getElementById("insp").innerHTML = `<span class="unit">${esc(u)}${esc(n.pole)}</span>
      <div class="lab">${esc(n.label || "unlabelled")}</div>
      <dl class="kv"><dt>roles</dt><dd>${esc(n.roles.join(", "))}${n.via ? " via " + esc(n.via) : ""}</dd>
      <dt>label confidence</dt><dd>${f2(n.confidence)}</dd>${res(c, "Claude tests")}${res(b, "Bonsai tests")}</dl>
      <div class="chart-wrap" id="mini"></div>
      <div class="eyebrow" style="color:var(--ink-3)">nerve's sentences, as this neuron sees them</div>
      <div class="eyebrow" style="color:var(--ink-3);margin-top:6px">top corpus examples (${esc(n.pole)} pole)</div>
      ${(n.examples || []).slice(0, 4).map(t => `<div class="ex">${hl(t.slice(-140))}</div>`).join("")}`;
    miniIris(document.getElementById("mini"), D.bank_units.indexOf(u));
  }

  function miniIris(wrap, idx) {
    if (idx < 0) return;
    const rows = D.bank_rows, W = 300, C = W / 2, R1 = 34, R = 130;
    const order = ["on", "held-out", "near", "spelling", "opposite", "unrelated"];
    const sec = r => r.kind === "top" ? (r.rel >= 0.5 ? "on" : r.rel_neg >= 0.8 ? "opposite" : "unrelated") : r.kind === "corpus" ? "unrelated" : r.kind;
    const pts = rows.map((r, i) => ({ s: sec(r), rel: r.rel, a: D.bank_acts[i][idx], t: r.text }));
    const secs = order.filter(o => pts.some(p => p.s === o)), span = 2 * Math.PI / secs.length;
    const svg = mk("svg", { viewBox: `-20 -10 ${W + 40} ${W + 20}`, role: "img", "aria-label": "Mini iris" });
    [1, 0].forEach(rel => mk("circle", { cx: C, cy: C, r: R1 + (1 - rel) * (R - R1), fill: "none", stroke: "var(--grid)" }, svg));
    secs.forEach((s, si) => {
      const a0 = -Math.PI / 2 + si * span, am = a0 + span / 2;
      txt(svg, C + (R + 14) * Math.cos(am), C + (R + 14) * Math.sin(am) + 3, s, { "text-anchor": "middle", "font-size": 9.5 });
      const mine = pts.filter(p => p.s === s).sort((p, q) => q.rel - p.rel);
      mine.forEach((p, i) => { const a = a0 + span * (0.08 + 0.84 * (mine.length > 1 ? i / (mine.length - 1) : 0.5)); const rr = R1 + (1 - Math.max(0, Math.min(1, p.rel))) * (R - R1) + ((i % 5) - 2) * 4; p.x = C + rr * Math.cos(a); p.y = C + rr * Math.sin(a); });
    });
    pts.sort((p, q) => Math.abs(p.a) - Math.abs(q.a)).forEach(p => {
      const v = Math.max(-1, Math.min(1, p.a));
      const col = v >= 0 ? `color-mix(in oklab, var(--div-pos) ${Math.round(100 * Math.sqrt(v))}%, var(--div-mid))` : `color-mix(in oklab, var(--div-neg) ${Math.round(100 * Math.sqrt(-v))}%, var(--div-mid))`;
      mk("circle", { cx: p.x, cy: p.y, r: 2 + 3.5 * Math.min(1, Math.abs(v)), fill: col }, svg);
    });
    mk("circle", { cx: C, cy: C, r: 16, fill: "var(--accent-soft)", stroke: "var(--accent)" }, svg);
    wrap.appendChild(svg);
  }

  // ---------------- lateral cluster
  if (D.lateral_inv) {
    const de = D.lateral_inv.de, gm = D.lateral_inv.gmoo;
    const names = de.nodes.map(n => n.name);
    const cell = r => !r ? "–" : `<span style="color:var(--${r.satisfied ? "good" : "bad"});font-weight:600">${r.satisfied ? "✓" : "✗"}</span> ${names.map(nm => `${nm} ${f2(r.y[nm])}`).join(" · ")}<div style="font-size:.75rem;color:var(--ink-3)">${r.evals} evals · ${esc(r.sentences.map(s => s.text.slice(0, 50)).join(" | "))}…</div>`;
    add(`<div class="eyebrow">Lateral cluster</div><h2>Relatives of psychological "nerve", and how they combine</h2>
      <p class="prose">${esc(D.lateral_text)}</p>
      <div class="tbl"><table><thead><tr><th>Question</th><th>SciPy differential evolution</th><th>globalMOO</th></tr></thead><tbody>
      ${Object.keys(de.goals).map(k => `<tr><td><b>${esc(k.replaceAll("_", " "))}</b><div style="font-size:.78rem;color:var(--ink-3)">${esc(de.goals[k].question)}</div></td><td>${cell(de.goals[k])}</td><td>${cell(gm && gm.goals[k])}</td></tr>`).join("")}
      </tbody></table></div>`);
  }

  // ---------------- sources
  {
    const S = D.sources.summary, R = D.sources.rows;
    const s = add(`<div class="eyebrow">Two authors</div><h2>Does a neuron treat text the model wrote itself differently?</h2>
      <p class="prose">Every label was tested twice. Once with 8 + 8 sentences written by Claude agents, and once with 8 + 8 written by Bonsai-8B itself from the same label. Both sets were committed before either was run. Bonsai's own text is, as expected, more predictable to Bonsai (lower perplexity).</p>
      <div class="tiles">
        <div class="tile"><span class="v">${pct(S.fire_rate.claude)} / ${pct(S.fire_rate.bonsai)}</span><span class="l">fire rate of "should fire" sentences: Claude / Bonsai</span></div>
        <div class="tile"><span class="v">${pct(S.false_pos_rate.claude)} / ${pct(S.false_pos_rate.bonsai)}</span><span class="l">false-positive rate of near misses: Claude / Bonsai</span></div>
        <div class="tile"><span class="v">${S.labels_surviving.claude} / ${S.labels_surviving.bonsai}</span><span class="l">labels that held, of ${S.n_labels}: Claude / Bonsai tests</span></div>
        <div class="tile"><span class="v">${f2(S.perplexity_median.claude)} / ${f2(S.perplexity_median.bonsai)}</span><span class="l">median perplexity under Bonsai: Claude / Bonsai sentences</span></div>
      </div>
      <div class="two"><div class="panel"><div class="chart-wrap" id="srcplot"></div><p style="font-size:.8rem;color:var(--ink-3)">Each dot is one label: share of its "should fire" sentences that fired, by author. Above the diagonal, Bonsai's sentences fired it more.</p></div>
      <div class="callout"><h3>Reading it</h3><p>${esc(D.sources_text)}</p></div></div>`);
    const W = 360, m = 40, x = v => m + v * (W - 2 * m), y = v => W - m - v * (W - 2 * m);
    const svg = mk("svg", { viewBox: `0 0 ${W} ${W}`, role: "img", "aria-label": "Per-label fire rate, Claude vs Bonsai sentences" });
    [0, 0.5, 1].forEach(v => { mk("line", { x1: x(v), x2: x(v), y1: y(0), y2: y(1), stroke: "var(--grid)" }, svg); mk("line", { x1: x(0), x2: x(1), y1: y(v), y2: y(v), stroke: "var(--grid)" }, svg); txt(svg, x(v), W - m + 16, pct(v), { "text-anchor": "middle" }); txt(svg, m - 6, y(v) + 4, pct(v), { "text-anchor": "end" }); });
    mk("line", { x1: x(0), y1: y(0), x2: x(1), y2: y(1), stroke: "var(--ink-3)", "stroke-dasharray": "4 4" }, svg);
    txt(svg, W / 2, W - 4, "Claude-written: fired", { "text-anchor": "middle" });
    const tt = txt(svg, 12, W / 2, "Bonsai-written: fired", { "text-anchor": "middle", transform: `rotate(-90 12 ${W / 2})` });
    const wrap = document.getElementById("srcplot"); wrap.appendChild(svg);
    const tip = document.createElement("div"); tip.className = "tip"; tip.hidden = true; wrap.appendChild(tip);
    R.forEach((r, i) => {
      const jx = ((i * 37) % 11 - 5) * 0.004, jy = ((i * 53) % 11 - 5) * 0.004;
      const c = mk("circle", { cx: x(r.claude_fire + jx), cy: y(r.bonsai_fire + jy), r: 4.5, fill: "var(--s1)", "fill-opacity": 0.7, stroke: "var(--surface)" }, svg);
      c.addEventListener("pointerenter", () => { const b = svg.getBoundingClientRect(); tip.innerHTML = `<b>${esc(r.unit)}</b> ${esc(r.label.slice(0, 80))}<br>Claude ${pct(r.claude_fire)} · Bonsai ${pct(r.bonsai_fire)}`; tip.style.left = (x(r.claude_fire) / W * b.width) + "px"; tip.style.top = (y(r.bonsai_fire) / W * b.height) + "px"; tip.hidden = false; });
      c.addEventListener("pointerleave", () => tip.hidden = true);
    });
  }

  // ---------------- table
  add(`<div class="eyebrow">All neurons</div><h2>Every node, its label and its tests</h2>
    <div class="tbl"><table><thead><tr><th>Neuron</th><th>Role</th><th>Label (blind agent)</th><th>Conf.</th><th>Claude tests</th><th>Bonsai tests</th></tr></thead><tbody>
    ${[...N].sort((a, b) => a.L - b.L || a.n - b.n).map(n => `<tr class="click" data-u="${esc(n.unit)}"><td><code>${esc(n.unit)}${esc(n.pole)}</code>${n.lateral ? ' <span class="chip good">lateral</span>' : ""}</td><td>${esc(n.roles.join(", "))}</td><td>${esc(n.label)}</td><td class="num">${f2(n.confidence)}</td>
      <td class="num">${n.claude ? `<span class="chip ${n.claude.survives ? "good" : "bad"}">${n.claude.n_fire}/${n.claude.n_written[0]} · ${n.claude.n_false_pos}</span>` : "–"}</td>
      <td class="num">${n.bonsai ? `<span class="chip ${n.bonsai.survives ? "good" : "bad"}">${n.bonsai.n_fire}/${n.bonsai.n_written[0]} · ${n.bonsai.n_false_pos}</span>` : "–"}</td></tr>`).join("")}
    </tbody></table></div><p style="font-size:.8rem;color:var(--ink-3)">Test cells: sentences that fired / written · near misses that fired. A label holds with at least 5 of 8 firing and at most 1 false positive.</p>`);
  document.querySelectorAll("tr.click").forEach(tr => tr.addEventListener("click", () => { inspect(tr.dataset.u); document.getElementById("graph").scrollIntoView({ behavior: "smooth", block: "start" }); }));

  add(`<div class="eyebrow">Caveats</div><ul class="prose" style="margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px">
    ${D.caveats.map(c => `<li>${esc(c)}</li>`).join("")}</ul>`);
  const first = N.find(n => n.lateral) || N[0]; if (first) inspect(first.unit);
})();
</script>
