ctor…'): 69% vs 80% fire, 15% vs 3% false positives. Bonsai can produce text with the concept but cannot reliably write around it. Its tests therefore fail most labels on false positives (18 of 48 held, against 38). Self-generated text gets no special treatment from these neurons.", "bank_units": ["L9/N3688", "L3/N6493", "L8/N7756", "L8/N3858", "L10/N6901", "L20/N5963", "L19/N2291", "L14/N9470", "L13/N3792", "L10/N5553", "L9/N9136", "L18/N12193", "L11/N10690", "L17/N2518", "L4/N7884", "L0/N873", "L2/N3473", "L9/N2494", "L4/N10610", "L10/N12013", "L9/N1865", "L4/N12227", "L0/N6992", "L1/N4037", "L9/N4146", "L12/N469", "L4/N5387", "L9/N2080", "L5/N4471", "L9/N2445", "L2/N5072", "L4/N7510", "L9/N8208", "L8/N7333", "L10/N2242", "L10/N2906", "L9/N1061", "L10/N7706", "L7/N619", "L7/N7149", "L7/N9782", "L11/N900", "L12/N3688", "L0/N1684", "L4/N5727", "L5/N9269", "L4/N5828", "L7/N1548", "L6/N2055"], "bank_rows": [{"text": "The sciatic nerve runs from the lower back down through each leg.", "kind": "on", "rel": 0.1, "rel_neg": 0.1}, {"text": "Damage to the optic nerve can cause permanent loss of vision.", "kind": "on", "rel": 0.1, "rel_neg": 0.3}, {"text": "Each nerve is a bundle of fibers wrapped in a protective sheath.", "kind": "on", "rel": 0.1, "rel_neg": 0.0}, {"text": "Nerve conduction studies measure how fast signals travel along a nerve.", "kind": "on", "rel": 0.1, "rel_neg": 0.2}, {"text": "Waiting for the exam results was a nerve-racking experience.", "kind": "on", "rel": 1.0, "rel_neg": 0.0}, {"text": "The constant drilling next door is getting on my nerves.", "kind": "on", "rel": 1.0, "rel_neg": 0.0}, {"text": "She finally worked up the nerve to ask for a raise.", "kind": "on", "rel": 1.0, "rel_neg": 0.0}, {"text": "He lost his nerve at the last moment and stayed on the ledge.", "kind": "on", "rel": 1.0, "rel_neg": 0.0}, {"text": "I can't believe he had the nerve to blame me for his own mistake.", "kind": "on", "rel": 1.0, "rel_neg": 0.0}, {"text": "Nach dem langen Arbeitstag lagen ihre Nerven blank.", "kind": "on", "rel": 1.0, "rel_neg": 0.0}, {"text": "Der Nerv im Zahn wurde bei der Wurzelbehandlung entfernt.", "kind": "on", "rel": 0.1, "rel_neg": 0.2}, {"text": "Le nerf optique transmet les images de l'œil au cerveau.", "kind": "on", "rel": 0.1, "rel_neg": 0.0}, {"text": "El dentista tuvo que tratar el nervio de la muela.", "kind": "on", "rel": 0.1, "rel_neg": 0.2}, {"text": "Повреждение нерва может привести к потере чувствительности.", "kind": "on", "rel": 0.1, "rel_neg": 0.6}, {"text": "신경이 손상되면 손가락에 감각이 없어질 수 있다.", "kind": "on", "rel": 0.1, "rel_neg": 0.6}, {"text": "시험 때문에 신경이 많이 쓰였다.", "kind": "on", "rel": 1.0, "rel_neg": 0.0}, {"text": "يتكون الجهاز العصبي من الدماغ والحبل الشوكي والأعصاب.", "kind": "on", "rel": 0.1, "rel_neg": 0.0}, {"text": "神经系统负责传递身体各部分的信号。", "kind": "on", "rel": 0.1, "rel_neg": 0.1}, {"text": "神経が細い人は、小さなことでも気にしやすい。", "kind": "on", "rel": 1.0, "rel_neg": 0.0}, {"text": "A pinched nerve in the neck can send shooting pain down the arm.", "kind": "on", "rel": 0.1, "rel_neg": 0.9}, {"text": "The dentist numbed the nerve so I wouldn't feel any pain.", "kind": "on", "rel": 0.1, "rel_neg": 0.9}, {"text": "He felt nervous before stepping onto the stage.", "kind": "on", "rel": 0.9, "rel_neg": 0.0}, {"text": "Elle est devenue nerveuse en attendant le train.", "kind": "on", "rel": 1.0, "rel_neg": 0.0}, {"text": "The nervous system coordinates every movement of the body.", "kind": "on", "rel": 0.1, "rel_neg": 0.0}, {"text": "Neural networks were loosely inspired by the structure of the brain.", "kind": "on", "rel": 0.0, "rel_neg": 0.0}, {"text": "신경민 의원은 오늘 국회에서 기자회견을 열었다.", "kind": "on", "rel": 0.0, "rel_neg": 0.0}, {"text": "Neurologists diagnose disorders of the brain and spinal cord.", "kind": "near", "rel": 0.0, "rel_neg": 0.1}, {"text": "Neurons communicate with one another across tiny gaps called synapses.", "kind": "near", "rel": 0.0, "rel_neg": 0.0}, {"text": "The spinal cord carries signals between the brain and the rest of the body.", "kind": "near", "rel": 0.0, "rel_neg": 0.1}, {"text": "I was so anxious before the interview that my hands were shaking.", "kind": "near", "rel": 0.5, "rel_neg": 0.0}, {"text": "It took real courage to speak up in front of the whole board.", "kind": "near", "rel": 0.5, "rel_neg": 0.0}, {"text": "What audacity, showing up uninvited after everything he said!", "kind": "near", "rel": 0.5, "rel_neg": 0.0}, {"text": "Tendons connect muscles to bones and help transmit force.", "kind": "near", "rel": 0.0, "rel_neg": 0.0}, {"text": "Blood vessels carry oxygen-rich blood away from the heart.", "kind": "near", "rel": 0.0, "rel_neg": 0.0}, {"text": "Emperor Nero is said to have played music while Rome burned.", "kind": "spelling", "rel": 0.0, "rel_neg": 0.0}, {"text": "Nerva was a Roman emperor who ruled from 96 to 98 AD.", "kind": "spelling", "rel": 0.0, "rel_neg": 0.0}, {"text": "I never thought the old bridge would last this long.", "kind": "spelling", "rel": 0.0, "rel_neg": 0.0}, {"text": "The kids spent the afternoon firing Nerf darts across the yard.", "kind": "spelling", "rel": 0.0, "rel_neg": 0.0}, {"text": "Nirvana released Nevermind in 1991.", "kind": "spelling", "rel": 0.0, "rel_neg": 0.0}, {"text": "She played the solo with remarkable verve and confidence.", "kind": "spelling", "rel": 0.0, "rel_neg": 0.0}, {"text": "The bank keeps a reserve of cash for emergencies.", "kind": "spelling", "rel": 0.0, "rel_neg": 0.0}, {"text": "He's a self-described computer nerd who builds his own keyboards.", "kind": "spelling", "rel": 0.0, "rel_neg": 0.0}, {"text": "We spent a week on the beaches of Nerja in southern Spain.", "kind": "spelling", "rel": 0.0, "rel_neg": 0.0}, {"text": "Der Nerz ist ein kleines Raubtier mit wertvollem Fell.", "kind": "spelling", "rel": 0.0, "rel_neg": 0.0}, {"text": "The burn left her skin red, hot, and painful to the touch.", "kind": "opposite", "rel": 0.0, "rel_neg": 0.9}, {"text": "After sitting cross-legge <script>
(function () {
  const D = JSON.parse(document.getElementById("web-data").textContent);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const f2 = v => (v == null ? "–" : Number(v).toFixed(2));
  const pct = v => (v == null ? "–" : Math.round(100 * v) + "%");
  const ns = "http://www.w3.org/2000/svg";
  const mk = (t, a, p) => { const e = document.createElementNS(ns, t); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
  const txt = (p, x, y, s, ex = {}) => { const t = mk("text", Object.assign({ x, y, fill: "var(--ink-3)", "font-size": 11, "font-family": "IBM Plex Sans, sans-serif" }, ex), p); t.textContent = s; return t; };
  const app = document.getElementById("app");
  const add = html => { const s = document.createElement("section"); s.innerHTML = html; app.appendChild(s); return s; };
  const N = D.nodes, byU = Object.fromEntries(N.map(n => [n.unit, n]));
  const verdict = n => n.kind && /dense/.test(n.kind) ? "dense" : n.claude == null ? "na" : n.claude.survives ? "good" : "bad";

  // header
  const h = document.createElement("header"); h.style.cssText = "display:flex;flex-direction:column;gap:12px";
  const nHeld = N.filter(n => n.claude && n.claude.survives).length, nTested = N.filter(n => n.claude).length;
  h.innerHTML = `<div class="eyebrow">Neighbourhood web · L9/N3688 · Bonsai-8B (1-bit)</div><h1>The Nerve Neighbourhood</h1>
    <p class="deck">${esc(D.claim)}</p>`;
  app.appendChild(h);
  add(`<div class="tiles">
    <div class="tile"><span class="v">${N.length}</span><span class="l">neurons reached from "nerve" (readers, their other inputs, co-firing, second-hop feeders)</span></div>
    <div class="tile"><span class="v">${nHeld} / ${nTested}</span><span class="l">labels that held a pre-registered 8 + 8 sentence test (Claude-written, latest round; dense units count as failed)</span></div>
    <div class="tile"><span class="v">${D.lateral.length}</span><span class="l">lateral relatives of psychological "nerve" found (tension, suspense, anticipation…)</span></div>
    <div class="tile"><span class="v">${pct(D.sources.summary.fire_rate.bonsai)} vs ${pct(D.sources.summary.fire_rate.claude)}</span><span class="l">fire rate of Bonsai-written vs Claude-written test sentences, same labels</span></div></div>`);

  // ---------------- graph
  const g = add(`<div class="eyebrow">Web</div><h2>Who feeds it, who reads it, who sits beside it</h2>
    <div class="legend"><span><i style="background:var(--good)"></i>label held its test</span><span><i style="background:var(--bad)"></i>label failed</span><span><i style="background:var(--na)"></i>not tested</span><span><i style="background:var(--surface);border:2px solid var(--ink-3)"></i>dense unit (on for much of the text)</span>
    <span><i class="ln" style="background:var(--ink)"></i>feeds</span><span><i class="ln" style="background:var(--s1)"></i>reads "nerve"</span><span><i class="ln" style="background:var(--s3)"></i>feeds a reader (lateral)</span>
    <span><i class="ln" style="background:var(--s2)"></i>gate</span><span><i class="ln" style="background:var(--ink-3)"></i>co-fires (dashed)</span><span><i style="background:none;border:2px solid var(--accent)"></i>lateral cluster</span></div>
    <div class="graph-band"><div class="panel graph-wrap" id="graph"></div><div class="panel insp" id="insp"><p style="color:var(--ink-3);font-size:.9rem">Select a neuron in the web or the table to inspect it.</p></div></div>`);
  {
    const colMax = Math.max(...Object.values([{ L: 9 }, ...N].reduce((a, n) => (a[n.L] = (a[n.L] || 0) + 1, a), {}))), W = 1180, H = Math.max(980, 90 + colMax * 52), mL = 30, mR = 150, mT = 30, mB = 40, Lmax = 20;
    const x = L => mL + L / Lmax * (W - mL - mR);
    const svg = mk("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Layered graph of neurons around L9/N3688" });
    for (let L = 0; L <= Lmax; L++) { mk("line", { x1: x(L), x2: x(L), y1: mT - 10, y2: H - mB + 6, stroke: "var(--grid)" }, svg); txt(svg, x(L), H - 14, "L" + L, { "text-anchor": "middle", "font-family": "IBM Plex Mono, monospace", "font-size": 12, fill: L === 9 ? "var(--accent)" : "var(--ink-3)" }); }
    const all = [{ unit: D.center, L: 9, center: true }, ...N];
    const cols = {};
    all.forEach(n => (cols[n.L] = cols[n.L] || []).push(n));
    const order = r => (r.center ? 5 : r.roles.includes("input") || r.roles.includes("gate") ? 1 : r.roles.includes("hop-2 upstream") ? 0 : r.roles.includes("reader") ? 3 : r.roles.includes("co-fires") ? 6 : 8);
    Object.values(cols).forEach(c => { c.sort((a, b) => order(a) - order(b) || a.n - b.n); c.forEach((n, i) => { n.y = mT + 20 + (i + 0.5) * ((H - mT - mB - 30) / c.length); n.x = x(n.L) + (c.length > 5 ? ((i % 2) * 2 - 1) * 12 : 0); }); });
    const pos = Object.fromEntries(all.map(n => [n.unit, n]));
    const col = { feeds: "var(--ink)", reads: "var(--s1)", "feeds reader": "var(--s3)", "feeds lateral": "var(--s3)", gates: "var(--s2)", "co-fires": "var(--ink-3)" };
    D.edges.forEach(e => {
      const a = pos[e.from], b = pos[e.to]; if (!a || !b) return;
      const w = Math.min(4, 0.8 + 18 * Math.abs(e.w) * (e.kind === "co-fires" ? 0.15 : 1));
      const mx = (a.x + b.x) / 2;
      mk("path", { d: `M${a.x},${a.y} C${mx},${a.y} ${mx},${b.y} ${b.x},${b.y}`, fill: "none", stroke: col[e.kind] || "var(--ink-3)", "stroke-width": w,
        "stroke-opacity": e.kind === "co-fires" ? 0.5 : 0.75, "stroke-dasharray": e.kind === "co-fires" ? "4 4" : "" }, svg);
    });
    const tipWrap = document.getElementById("graph"); tipWrap.style.position = "relative";
    all.forEach(n => {
      const gN = mk("g", { class: "node", tabindex: 0, role: "button", "aria-label": n.unit }, svg);
      const fill = n.center ? "var(--accent)" : verdict(n) === "dense" ? "var(--surface)" : `var(--${verdict(n) === "good" ? "good" : verdict(n) === "bad" ? "bad" : "na"})`;
      mk("circle", { cx: n.x, cy: n.y, r: n.center ? 15 : 9, fill, stroke: n.lateral ? "var(--accent)" : verdict(n) === "dense" ? "var(--ink-3)" : "var(--surface)", "stroke-width": n.lateral ? 3 : verdict(n) === "dense" ? 2.5 : 1.5 }, gN);
      const short = n.center ? "nerve" : (n.short || "");
      txt(gN, n.x + (n.center ? 19 : 13), n.y + 4.5, short, { "font-size": n.center ? 15 : 12.5, fill: n.center ? "var(--ink)" : "var(--ink-2)", "font-weight": n.center || n.lateral ? 600 : 400, stroke: "var(--surface)", "stroke-width": 3.5, "paint-order": "stroke", "stroke-linejoin": "round" });
      if (!n.center) { gN.addEventListener("click", () => inspect(n.unit)); gN.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); inspect(n.unit); } }); }
    });
    document.getElementById("graph").appendChild(svg);
  }

  function inspect(u) {
    const n = byU[u], c = n.claude, b = n.bonsai;
    const res = (r, who) => !r ? `<dt>${who}</dt><dd>–</dd>` : `<dt>${who}</dt><dd><span class="chip ${r.survives ? "good" : "bad"}">${r.survives ? "held" : "failed"}</span> fire ${r.n_fire}/${r.n_written[0]} · FP ${r.n_false_pos}/${r.n_written[1]}</dd>`;
    const hl = t => esc(t).replace("⟦", "<mark>").replace("⟧", "</mark>").replace(/⏎/g, "↵ ");
    document.getElementById("insp").innerHTML = `<span class="unit">${esc(u)}${esc(n.pole)}</span>
      <div class="lab">${esc(n.label || "unlabelled")}</div>
      <dl class="kv"><dt>roles</dt><dd>${esc(n.roles.join(", "))}${n.via ? " via " + esc(n.via) : ""}</dd>
      <dt>label confidence</dt><dd>${f2(n.confidence)}</dd><dt>kind</dt><dd>${esc(n.kind || "–")}</dd><dt>labelling rounds</dt><dd>${n.attempts}</dd>${res(c, "Claude tests (latest)")}${res(b, "Bonsai tests")}</dl>
      <div class="chart-wrap" id="mini"></div>
      <div class="eyebrow" style="color:var(--ink-3)">nerve's sentences, as this neuron sees them</div>
      <div class="eyebrow" style="color:var(--ink-3);margin-top:6px">top corpus examples (${esc(n.pole)} pole)</div>
      ${(n.examples || []).slice(0, 4).map(t => `<div class="ex">${hl(t.slice(-140))}</div>`).join("")}`;
    miniIris(document.getElementById("mini"), D.bank_units.indexOf(u));
  }

  function miniIris(wrap, idx) {
    if (idx < 0) return;
    const rows = D.bank_rows, W = 300, C = W / 2, R1 = 34, R = 130;
    const order = ["on", "held-out", "near", "spelling", "opposite", "unrelated"];
    const sec = r => r.kind === "top" ? (r.rel >= 0.5 ? "on" : r.rel_neg >= 0.8 ? "opposite" : "unrelated") : r.kind === "corpus" ? "unrelated" : r.kind;
    const pts = rows.map((r, i) => ({ s: sec(r), rel: r.rel, a: D.bank_acts[i][idx], t: r.text }));
    const secs = order.filter(o => pts.some(p => p.s === o)), span = 2 * Math.PI / secs.length;
    const svg = mk("svg", { viewBox: `-20 -10 ${W + 40} ${W + 20}`, role: "img", "aria-label": "Mini iris" });
    [1, 0].forEach(rel => mk("circle", { cx: C, cy: C, r: R1 + (1 - rel) * (R - R1), fill: "none", stroke: "var(--grid)" }, svg));
    secs.forEach((s, si) => {
      const a0 = -Math.PI / 2 + si * span, am = a0 + span / 2;
      txt(svg, C + (R + 14) * Math.cos(am), C + (R + 14) * Math.sin(am) + 3, s, { "text-anchor": "middle", "font-size": 9.5 });
      const mine = pts.filter(p => p.s === s).sort((p, q) => q.rel - p.rel);
      mine.forEach((p, i) => { const a = a0 + span * (0.08 + 0.84 * (mine.length > 1 ? i / (mine.length - 1) : 0.5)); const rr = R1 + (1 - Math.max(0, Math.min(1, p.rel))) * (R - R1) + ((i % 5) - 2) * 4; p.x = C + rr * Math.cos(a); p.y = C + rr * Math.sin(a); });
    });
    pts.sort((p, q) => Math.abs(p.a) - Math.abs(q.a)).forEach(p => {
      const v = Math.max(-1, Math.min(1, p.a));
      const col = v >= 0 ? `color-mix(in oklab, var(--div-pos) ${Math.round(100 * Math.sqrt(v))}%, var(--div-mid))` : `color-mix(in oklab, var(--div-neg) ${Math.round(100 * Math.sqrt(-v))}%, var(--div-mid))`;
      mk("circle", { cx: p.x, cy: p.y, r: 2 + 3.5 * Math.min(1, Math.abs(v)), fill: col }, svg);
    });
    mk("circle", { cx: C, cy: C, r: 16, fill: "var(--accent-soft)", stroke: "var(--accent)" }, svg);
    wrap.appendChild(svg);
  }

  // ---------------- trying to disprove 'nerve'
  if (D.disproof && D.disproof.d1 && D.token_table) {
    const bn = k => ({ strength: "strength", impact_injury: "impact / injury", reaction_sensation: "sensation", mental_fortitude: "fortitude, no word" }[k] || k);
    const X = D.disproof, d1 = X.d1, d3 = X.d3, h4 = X.h4, pred = X.pred, T = D.token_table;
    const fam = t => /nerv|nerf|нерв|신경|神|عصب/i.test(t) ? "nerve word" : /strong|strength|power/i.test(t) ? "strength" : /injur|wound|hit|struck|strike|blow|hurt|kill|shot|attack|damage|crash|hard|heavy|violent/i.test(t) ? "impact / injury" : "other";
    const famCol = { "nerve word": "var(--accent)", strength: "var(--s1)", "impact / injury": "var(--s2)", other: "var(--na)" };
    const d2 = X.d2 || {}, d2top = b => { const r = d2[b]; if (!r) return "–"; const [t, k] = Object.entries(r.D_themes)[0] || ["–", 0]; return `${Math.round(100 * (1 - r.share.D))}% nerve-related; largest other theme “${esc(t)}” ${k}/${r.n}`; };
    const rows = [
      ["D1 · every strong firing (≥ 0.3 of max) in 6.1M corpus tokens", "≥ 90% within 3 tokens of a 'nerve' word", `${Math.round(100 * d1.share_with_morpheme)}% (${d1.with_morpheme} of ${d1.strong_tokens})`, false],
      ["D2 · 120 weak/mid-band contexts, annotated blind to band", "'nerve' meaning still visible; no theme ≥ ⅓ of a band", `0.2–0.3 band: ${d2top("0.20-0.30")}. 0.3–0.5 band: ${d2top("0.30-0.50")}. No theme reached ⅓, so its disproof condition was not met.`, false],
      ["D3 · leak search over 1,199 sentences with no 'nerve' word (SciPy DE)", "max < 0.4, and not through an unrelated concept", `${f2(d3.de_max.y.act)}, peak on “${esc((d3.de_max.peak_token || "").trim())}”: the strength branch, not a new concept`, false],
      ["H4 · is it one coarser job: force / strength / strain?", "all 4 branches AUROC ≥ 0.75", Object.entries(h4.branches).map(([k, v]) => `${bn(k)} ${f2(v.auroc)}`).join(" · "), false],
      ["Anticipation · does it fire where 'nerve' is the likely next word?", "(exploratory, no prediction)", `no: rank correlation ${f2(pred.spearman_act_vs_p_next_nerve)} over ${pred.positions.toLocaleString()} positions`, null],
    ];
    add(`<div class="eyebrow">Trying to disprove it</div><h2>We tried to break the "nerve" label. It broke in an informative way.</h2>
      <p class="prose">${esc(D.disproof_text)}</p>
      <div class="tbl"><table><thead><tr><th>Attempt</th><th>Prediction (committed before running)</th><th>Result</th></tr></thead><tbody>
      ${rows.map(([a, b, c, ok]) => `<tr><td>${esc(a)}</td><td>${esc(b)}</td><td>${ok === null ? "" : `<span class="chip ${ok ? "good" : "bad"}">${ok ? "held" : "failed"}</span> `}${c}</td></tr>`).join("")}
      </tbody></table></div>
      <div class="two"><div class="panel"><h3>Which tokens make it fire strongly</h3><div class="chart-wrap" id="tokbars"></div>
        <p style="font-size:.8rem;color:var(--ink-3)">Bars count strong firings (≥ 0.3 of max) per token across 6.1M corpus tokens. Each label gives the count, the share of that token's occurrences that fire strongly, and its mean activation. " strong" fires the neuron more often and more reliably than " nerve". Most corpus uses of " nerve" are anatomical, and those push the opposite pole.</p></div>
      <div class="panel"><h3>Four candidate branches, none containing a "nerve" word</h3><div class="chart-wrap" id="h4bars"></div>
        <p style="font-size:.8rem;color:var(--ink-3)">Mean activation on 8 branch sentences (coloured) vs 8 matched near misses (grey), with AUROC. The dashed line is psychological "nerve" itself. Strength and impact are real but weaker branches. Sensation and fortitude-without-the-word do nothing.</p></div></div>
      <div class="callout"><h3>Revised reading</h3><p>${esc(D.disproof_verdict)}</p></div>`);
    {
      const R = T.rows.slice(0, 16), W = 520, rowH = 22, m = { l: 118, r: 150, t: 4 }, H = m.t + R.length * rowH + 6;
      const mx = Math.max(...R.map(r => r.strong));
      const svg = mk("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Strong firings per token: ' strong' leads, then ' nerve' and injury words" });
      R.forEach((r, i) => {
        const y = m.t + i * rowH, w = (W - m.l - m.r) * r.strong / mx;
        txt(svg, m.l - 8, y + 15, JSON.stringify(r.token), { "text-anchor": "end", "font-family": "IBM Plex Mono, monospace", "font-size": 11.5, fill: "var(--ink)" });
        mk("rect", { x: m.l, y: y + 4, width: Math.max(2, w), height: rowH - 8, rx: 3, fill: famCol[fam(r.token)] }, svg);
        txt(svg, m.l + w + 6, y + 15, `${r.strong} · ${Math.round(100 * r.share)}% · mean ${r.mean >= 0 ? "+" : ""}${f2(r.mean)}`, { "font-size": 10.5, fill: "var(--ink-2)" });
      });
      const wrap = document.getElementById("tokbars"); wrap.appendChild(svg);
      const lg = document.createElement("div"); lg.className = "legend";
      lg.innerHTML = Object.entries(famCol).map(([k, c]) => `<span><i style="background:${c}"></i>${k}</span>`).join("");
      wrap.appendChild(lg);
    }
    {
      const B = Object.entries(h4.branches), W = 520, H = 260, m = { l: 40, r: 10, t: 16, b: 46 };
      const ref = h4.reference.reduce((a, r) => a + r.act, 0) / h4.reference.length, ymax = Math.max(0.6, ref * 1.15);
      const y = v => m.t + (1 - v / ymax) * (H - m.t - m.b), gw = (W - m.l - m.r) / B.length;
      const svg = mk("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Branch test: strength and impact fire, sensation and fortitude do not" });
      [0, 0.2, 0.4].forEach(v => { mk("line", { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: "var(--grid)" }, svg); txt(svg, m.l - 6, y(v) + 4, f2(v), { "text-anchor": "end" }); });
      mk("line", { x1: m.l, x2: W - m.r, y1: y(ref), y2: y(ref), stroke: "var(--accent)", "stroke-width": 2, "stroke-dasharray": "5 4" }, svg);
      txt(svg, W - m.r, y(ref) - 6, `psychological "nerve" (${f2(ref)})`, { "text-anchor": "end", fill: "var(--ink-2)", "font-size": 10.5 });
      const bcol = { strength: "var(--s1)", impact_injury: "var(--s2)" };
      B.forEach(([k, v], i) => {
        const cx = m.l + gw * (i + 0.5), bw = gw * 0.28, q = Math.max(0, v.mean_quiet);
        mk("rect", { x: cx - bw - 1, y: y(v.mean_fire), width: bw, height: Math.max(1, y(0) - y(v.mean_fire)), rx: 3, fill: bcol[k] || "var(--na)" }, svg);
        mk("rect", { x: cx + 1, y: y(q), width: bw, height: Math.max(1, y(0) - y(q)), rx: 3, fill: "var(--grid)" }, svg);
        txt(svg, cx - bw / 2 - 1, y(v.mean_fire) - 5, f2(v.mean_fire), { "text-anchor": "middle", "font-size": 10, fill: "var(--ink-2)" });
        txt(svg, cx, H - m.b + 17, bn(k), { "text-anchor": "middle", "font-size": 11, fill: "var(--ink-2)" });
        txt(svg, cx, H - m.b + 32, `AUROC ${f2(v.auroc)}`, { "text-anchor": "middle", "font-size": 10.5, fill: v.auroc >= 0.75 ? "var(--good)" : "var(--bad)", "font-weight": 600 });
      });
      document.getElementById("h4bars").appendChild(svg);
    }
  }

  // ---------------- lateral cluster
  if (D.lateral_inv) {
    const de = D.lateral_inv.de, gm = D.lateral_inv.gmoo;
    const names = de.nodes.map(n => n.name);
    const cell = r => !r ? "–" : `<span style="color:var(--${r.satisfied ? "good" : "bad"});font-weight:600">${r.satisfied ? "✓" : "✗"}</span> ${names.map(nm => `${nm} ${f2(r.y[nm])}`).join(" · ")}<div style="font-size:.75rem;color:var(--ink-3)">${r.evals} evals · ${esc(r.sentences.map(s => s.text.slice(0, 50)).join(" | "))}…</div>`;
    add(`<div class="eyebrow">Lateral cluster</div><h2>Relatives of psychological "nerve", and how they combine</h2>
      <p class="prose">${esc(D.lateral_text)}</p>
      <div class="tbl"><table><thead><tr><th>Question</th><th>SciPy differential evolution</th><th>globalMOO</th></tr></thead><tbody>
      ${Object.keys(de.goals).map(k => `<tr><td><b>${esc(k.replaceAll("_", " "))}</b><div style="font-size:.78rem;color:var(--ink-3)">${esc(de.goals[k].question)}</div></td><td>${cell(de.goals[k])}</td><td>${cell(gm && gm.goals[k])}</td></tr>`).join("")}
      </tbody></table></div>`);
  }

  // ---------------- sources
  {
    const S = D.sources.summary, R = D.sources.rows;
    const s = add(`<div class="eyebrow">Two authors</div><h2>Does a neuron treat text the model wrote itself differently?</h2>
      <p class="prose">Every label was tested twice. Once with 8 + 8 sentences written by Claude agents, and once with 8 + 8 written by Bonsai-8B itself from the same label. Both sets were committed before either was run. Bonsai's own text is, as expected, more predictable to Bonsai (lower perplexity).</p>
      <div class="tiles">
        <div class="tile"><span class="v">${pct(S.fire_rate.claude)} / ${pct(S.fire_rate.bonsai)}</span><span class="l">fire rate of "should fire" sentences: Claude / Bonsai</span></div>
        <div class="tile"><span class="v">${pct(S.false_pos_rate.claude)} / ${pct(S.false_pos_rate.bonsai)}</span><span class="l">false-positive rate of near misses: Claude / Bonsai</span></div>
        <div class="tile"><span class="v">${S.labels_surviving.claude} / ${S.labels_surviving.bonsai}</span><span class="l">labels that held, of ${S.n_labels}: Claude / Bonsai tests</span></div>
        <div class="tile"><span class="v">${f2(S.perplexity_median.claude)} / ${f2(S.perplexity_median.bonsai)}</span><span class="l">median perplexity under Bonsai: Claude / Bonsai sentences</span></div>
      </div>
      <div class="two"><div class="panel"><div class="chart-wrap" id="srcplot"></div><p style="font-size:.8rem;color:var(--ink-3)">Each dot is one label: share of its "should fire" sentences that fired, by author. Above the diagonal, Bonsai's sentences fired it more.</p></div>
      <div class="callout"><h3>Reading it</h3><p>${esc(D.sources_text)}</p></div></div>`);
    const W = 360, m = 40, x = v => m + v * (W - 2 * m), y = v => W - m - v * (W - 2 * m);
    const svg = mk("svg", { viewBox: `0 0 ${W} ${W}`, role: "img", "aria-label": "Per-label fire rate, Claude vs Bonsai sentences" });
    [0, 0.5, 1].forEach(v => { mk("line", { x1: x(v), x2: x(v), y1: y(0), y2: y(1), stroke: "var(--grid)" }, svg); mk("line", { x1: x(0), x2: x(1), y1: y(v), y2: y(v), stroke: "var(--grid)" }, svg); txt(svg, x(v), W - m + 16, pct(v), { "text-anchor": "middle" }); txt(svg, m - 6, y(v) + 4, pct(v), { "text-anchor": "end" }); });
    mk("line", { x1: x(0), y1: y(0), x2: x(1), y2: y(1), stroke: "var(--ink-3)", "stroke-dasharray": "4 4" }, svg);
    txt(svg, W / 2, W - 4, "Claude-written: fired", { "text-anchor": "middle" });
    const tt = txt(svg, 12, W / 2, "Bonsai-written: fired", { "text-anchor": "middle", transform: `rotate(-90 12 ${W / 2})` });
    const wrap = document.getElementById("srcplot"); wrap.appendChild(svg);
    const tip = document.createElement("div"); tip.className = "tip"; tip.hidden = true; wrap.appendChild(tip);
    R.forEach((r, i) => {
      const jx = ((i * 37) % 11 - 5) * 0.004, jy = ((i * 53) % 11 - 5) * 0.004;
      const c = mk("circle", { cx: x(r.claude_fire + jx), cy: y(r.bonsai_fire + jy), r: 4.5, fill: "var(--s1)", "fill-opacity": 0.7, stroke: "var(--surface)" }, svg);
      c.addEventListener("pointerenter", () => { const b = svg.getBoundingClientRect(); tip.innerHTML = `<b>${esc(r.unit)}</b> ${esc(r.label.slice(0, 80))}<br>Claude ${pct(r.claude_fire)} · Bonsai ${pct(r.bonsai_fire)}`; tip.style.left = (x(r.claude_fire) / W * b.width) + "px"; tip.style.top = (y(r.bonsai_fire) / W * b.height) + "px"; tip.hidden = false; });
      c.addEventListener("pointerleave", () => tip.hidden = true);
    });
  }

  // ---------------- table
  add(`<div class="eyebrow">All neurons</div><h2>Every node, its label and its tests</h2>
    <div class="tbl"><table><thead><tr><th>Neuron</th><th>Role</th><th>Label (blind agent)</th><th>Conf.</th><th>Claude tests</th><th>Bonsai tests</th></tr></thead><tbody>
    ${[...N].sort((a, b) => a.L - b.L || a.n - b.n).map(n => `<tr class="click" data-u="${esc(n.unit)}"><td><code>${esc(n.unit)}${esc(n.pole)}</code>${n.lateral ? ' <span class="chip good">lateral</span>' : ""}</td><td>${esc(n.roles.join(", "))}</td><td>${esc(n.label)}</td><td class="num">${f2(n.confidence)}</td>
      <td class="num">${n.claude ? `<span class="chip ${n.claude.survives ? "good" : "bad"}">${n.claude.n_fire}/${n.claude.n_written[0]} · ${n.claude.n_false_pos}</span>` : "–"}</td>
      <td class="num">${n.bonsai ? `<span class="chip ${n.bonsai.survives ? "good" : "bad"}">${n.bonsai.n_fire}/${n.bonsai.n_written[0]} · ${n.bonsai.n_false_pos}</span>` : "–"}</td></tr>`).join("")}
    </tbody></table></div><p style="font-size:.8rem;color:var(--ink-3)">Test cells: sentences that fired / written · near misses that fired. A label holds with at least 5 of 8 firing and at most 1 false positive.</p>`);
  document.querySelectorAll("tr.click").forEach(tr => tr.addEventListener("click", () => { inspect(tr.dataset.u); document.getElementById("graph").scrollIntoView({ behavior: "smooth", block: "start" }); }));

  add(`<div class="eyebrow">Caveats</div><ul class="prose" style="margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px">
    ${D.caveats.map(c => `<li>${esc(c)}</li>`).join("")}</ul>`);
  const first = N.find(n => n.lateral) || N[0]; if (first) inspect(first.unit);
})();
</script>
